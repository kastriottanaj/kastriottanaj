name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Catch a broken build here rather than on the server.
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx astro check

      # A page that ships without a sitemap entry is invisible where it costs
      # most, and nobody notices for months. Non-zero here blocks the deploy.
      - run: npm run check:sitemap

      # Same shape of mistake one layer over: a share card that 404s or is the
      # wrong format posts to LinkedIn as a grey box, and the page looks fine.
      - run: npm run check:og

  deploy:
    name: Deploy to Hetzner
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # No `script_stop` — v1 dropped that input, so passing it only earns a
          # warning and does nothing. deploy.sh sets `-euo pipefail` itself, and
          # the action fails the step on a non-zero exit anyway.
          # The server pulls and builds — same ARM64 architecture that runs it.
          script: /var/www/kastriottanaj/current/deploy/deploy.sh
